    - name: LSTM-Augmented DQN for Quantitative Trading in Partially Observable Markets
      description: First author; manuscript submitted to *Expert Systems with Applications* | Dec 2024–Present
      summary: |
        - Developed an LSTM-enhanced Deep Q-Network for financial trading under partial observability, combining recurrent state representation, moving-average-based action constraints, and a multi-objective reward balancing returns, risk, transaction costs, and position limits.
        - Backtested on historical China A-share data: achieved **24.25% annualised return** and **1.38 Sharpe ratio**, improving profitability by **39%** over baseline DQN under the same conditions.

    - name: Supply Chain Fulfilment Risk Identification and Strategy Validation
      description: Course project | May 2025–Jun 2025
      summary: |
        - Cleaned and engineered features from **180,000+ historical orders** and **17 business features**; used correlation screening and PCA to reduce a 24-dimensional feature space to **5 principal components**.
        - Compared **6 classification models** using five-fold cross-validation and grid-search tuning. Random Forest, XGBoost, and MLP achieved **96.69% accuracy**, with **98.2% recall** on high-risk orders; the best Random Forest model reached **0.9953 ROC-AUC**.
        - Identified actual transportation time as the leading risk driver (**0.58 feature importance**) and found that high-priced, heavily discounted products had approximately **47% higher delay risk** than comparable low-discount orders; proposed lead-time threshold alerts and tiered transport controls.

    - name: Measuring Supply Chain Resilience in the Photovoltaic Industry
      description: National Undergraduate Statistical Modelling Competition | Provincial Second Prize | Apr 2025–Jun 2025
      summary: |
        - Built a directed, weighted supply-chain network from five years of relationship data covering **20+ listed photovoltaic companies** across upstream, midstream, and downstream segments, using Python and NetworkX.
        - Applied PageRank and HITS to identify influential firms and vulnerable nodes, and GraphSAGE to extract node representations; simulated random and targeted firm-removal attacks to quantify changes in network connectivity and structural stability.

